# Lefthook config — `bun install` runs `lefthook install` automatically
# (see the "prepare" script in package.json) so checked-out clones get
# the git hooks wired up without an extra setup step.

pre-commit:
  parallel: true
  jobs:
    - name: biome
      glob: "*.{js,jsx,json,jsonc,ts}"
      run: bunx biome check --write --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
      stage_fixed: true

    - name: rustfmt
      glob: "*.rs"
      run: cargo fmt --all -- {staged_files}
      stage_fixed: true

    # Native check of every crate; the wasm32-only paths are covered by CI's
    # full build.
    - name: cargo
      glob: "*.{rs,toml}"
      run: cargo test --workspace --quiet
