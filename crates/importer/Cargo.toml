[package]
name = "trinkhallen-importer"
description = "Build-time data import: regions.yml -> dist/static/data, summaries, sitemap, regions table; asset hashing"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
trinkhallen-core.workspace = true
serde.workspace = true
# float_roundtrip: parse doubles exactly like JSON.parse so re-serialised
# coordinates match what the TS importer wrote.
serde_json = { workspace = true, features = ["float_roundtrip"] }
chrono.workspace = true
serde_yaml_ng = "0.10"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
