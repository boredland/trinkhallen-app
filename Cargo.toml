[workspace]
resolver = "3"
members = ["crates/core"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
rust-version = "1.98"

[workspace.dependencies]
trinkhallen-core = { path = "crates/core" }
trinkhallen-ui = { path = "crates/ui" }
dioxus = { version = "0.7.10", default-features = false, features = ["macro", "html", "signals", "hooks"] }
dioxus-ssr = "0.7.10"
dioxus-web = { version = "0.7.10", default-features = false, features = ["hydrate", "mounted", "document"] }
dioxus-fullstack-core = { version = "0.7.10", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
opening-hours = { version = "2.1.4", default-features = false }
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = "0.3"
getrandom = "0.3"

[profile.release]
lto = true
codegen-units = 1
opt-level = "z"
# No `strip = true`: stripping drops the externref table that wasm-bindgen's
# abort-recovery wrappers (worker-build default) depend on.
panic = "abort"
